<script src="src/data.js"></script>
<script type="text/babel" src="src/shell.jsx"></script>
<script type="text/babel" src="src/page-home.jsx"></script>
<script type="text/babel" src="src/page-dashboard.jsx"></script>
<script type="text/babel" src="src/page-courses.jsx"></script>
<script type="text/babel" src="src/page-advisor.jsx"></script>
<script type="text/babel" src="src/page-simulate.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

function App() {
  const [page, setPage] = useState("home");

  // Sync from hash
  useEffect(() => {
    const onHash = () => {
      const h = location.hash.replace("#", "");
      if (NAV.find(n => n.id === h)) setPage(h);
    };
    onHash();
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  function nav(id) {
    setPage(id);
    location.hash = id;
  }

  return (
    <div className="app" data-screen-label={"00 " + (NAV.find(n=>n.id===page)?.label || "")}>
      <Sidebar page={page} onNav={nav}/>
      <div className="main">
        <Topbar page={page}/>
        {page === "home" && <PageHome onNav={nav}/>}
        {page === "dashboard" && <PageDashboard/>}
        {page === "courses" && <PageCourses/>}
        {page === "advisor" && <PageAdvisor/>}
        {page === "simulate" && <PageSimulate/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
